<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- self-contained light card so it reads on GitHub light AND dark -->
  <rect x="1" y="1" width="1198" height="468" rx="16" fill="#fbfaf8" stroke="#e6e4e0" stroke-width="2"/>

  <!-- ===== header ===== -->
  <text x="44" y="58" font-size="30" font-weight="700" fill="#1f2328">Cheap Verifiers, Large Blind Spots</text>
  <text x="44" y="88" font-size="16" fill="#57606a">A self-improving cascade is trained only on errors its verifier can see — so it inherits the verifier&#8217;s blind spot.</text>
  <line x1="44" y1="108" x2="1156" y2="108" stroke="#ece9e4" stroke-width="1.5"/>

  <!-- arrowheads -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b6b6b"/></marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e7d32"/></marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b5341f"/></marker>
  </defs>

  <!-- ===== LEFT: the loop ===== -->
  <!-- edges (drawn first, nodes on top) -->
  <line x1="176" y1="210" x2="212" y2="210" stroke="#6b6b6b" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="350" y1="210" x2="384" y2="210" stroke="#6b6b6b" stroke-width="2" marker-end="url(#ah)"/>
  <text x="367" y="200" font-size="12" fill="#57606a" text-anchor="middle" font-style="italic">S<tspan baseline-shift="sub" font-size="9" font-style="normal">t</tspan>(x)</text>
  <!-- accept -> deliver (green) -->
  <line x1="516" y1="210" x2="616" y2="210" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ahg)"/>
  <text x="566" y="200" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="600">accept</text>
  <!-- reject -> teacher (down) -->
  <line x1="450" y1="238" x2="450" y2="300" stroke="#6b6b6b" stroke-width="2" marker-end="url(#ah)"/>
  <text x="462" y="276" font-size="12.5" fill="#57606a">reject</text>
  <!-- teacher -> deliver (up-right) -->
  <path d="M516,328 H660 V238" fill="none" stroke="#6b6b6b" stroke-width="2" marker-end="url(#ah)"/>
  <text x="590" y="322" font-size="12" fill="#57606a" text-anchor="middle" font-style="italic">G(x)</text>
  <!-- feedback: corrections fine-tune the student (dashed) -->
  <path d="M384,328 H150 V238" fill="none" stroke="#157a86" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <text x="150" y="360" font-size="12.5" fill="#157a86" font-weight="600">fine-tune &#8594; S<tspan baseline-shift="sub" font-size="9">t+1</tspan></text>

  <!-- nodes -->
  <g font-size="15" text-anchor="middle">
    <rect x="44"  y="182" width="132" height="56" rx="9" fill="#ffffff" stroke="#d0cdc7" stroke-width="1.5"/>
    <text x="110" y="216" fill="#1f2328">Query <tspan font-style="italic">x</tspan></text>
    <rect x="218" y="182" width="132" height="56" rx="9" fill="#ffffff" stroke="#d0cdc7" stroke-width="1.5"/>
    <text x="284" y="211" fill="#1f2328" font-weight="600">Student</text>
    <text x="284" y="228" fill="#57606a" font-size="12.5">cheap, tuned</text>
    <rect x="384" y="182" width="132" height="56" rx="9" fill="#ffffff" stroke="#d0cdc7" stroke-width="1.5"/>
    <text x="450" y="211" fill="#1f2328" font-weight="600">Verifier</text>
    <text x="450" y="228" fill="#57606a" font-size="12.5">frontier, $$$</text>
    <rect x="384" y="300" width="132" height="56" rx="9" fill="#ffffff" stroke="#d0cdc7" stroke-width="1.5"/>
    <text x="450" y="333" fill="#1f2328" font-weight="600">Teacher</text>
    <rect x="616" y="182" width="132" height="56" rx="9" fill="#eef6ef" stroke="#2e7d32" stroke-width="1.6"/>
    <text x="682" y="216" fill="#1f5a24" font-weight="600">Deliver</text>
  </g>

  <!-- blind-spot callout -->
  <path d="M566,206 V150" stroke="#b5341f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
  <rect x="360" y="118" width="392" height="34" rx="8" fill="#fbeeea" stroke="#b5341f" stroke-width="1.4"/>
  <text x="556" y="140" font-size="13.5" fill="#b5341f" text-anchor="middle" font-weight="600">blind spot: wrong answers the verifier accepts &#8212; shipped unflagged</text>

  <!-- divider -->
  <line x1="792" y1="150" x2="792" y2="420" stroke="#ece9e4" stroke-width="1.5"/>

  <!-- ===== RIGHT: the scissors ===== -->
  <text x="976" y="150" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="700">&#8230; and no in-loop metric can see it</text>

  <!-- axes -->
  <line x1="856" y1="404" x2="1140" y2="404" stroke="#c9c6c0" stroke-width="1.5"/>
  <line x1="856" y1="404" x2="856" y2="196" stroke="#c9c6c0" stroke-width="1.5"/>
  <text x="998" y="432" font-size="12.5" fill="#57606a" text-anchor="middle">rounds of self-training &#8594;</text>
  <text x="846" y="300" font-size="12.5" fill="#57606a" text-anchor="middle" transform="rotate(-90 846 300)">user-facing error</text>

  <!-- shaded hidden-harm gap -->
  <path d="M872,388 L1124,388 L1124,244 L872,372 Z" fill="#b5341f" fill-opacity="0.12"/>

  <!-- true error rising (red) -->
  <polyline points="872,372 935,352 998,318 1061,278 1124,244" fill="none" stroke="#b5341f" stroke-width="3"/>
  <circle cx="1124" cy="244" r="3.5" fill="#b5341f"/>
  <text x="1148" y="230" font-size="13" fill="#b5341f" font-weight="600" text-anchor="end">true error &#8594; 32%</text>

  <!-- dashboard flat (green) -->
  <polyline points="872,388 935,387 998,389 1061,386 1124,388" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="1124" cy="388" r="3.5" fill="#2e7d32"/>
  <text x="1148" y="376" font-size="13" fill="#2e7d32" font-weight="600" text-anchor="end">dashboard &#8776; 3%</text>

  <!-- footer tagline -->
  <text x="600" y="452" font-size="13.5" fill="#57606a" text-anchor="middle">The blind spot grows with student capability, shrinks with verifier capability, and hides behind a flat dashboard. Measured on real LLMs.</text>
</svg>
